services:
  postgres:
    image: postgres:16
    container_name: edukdo_postgres
    environment:
      POSTGRES_USER: edukdo
      POSTGRES_PASSWORD: edukdo_dev_password
      POSTGRES_DB: edukdo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edukdo_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
